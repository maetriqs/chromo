<!DOCTYPE html>
<!-- By The_headphones -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tic-Tac-Toe · Chromo</title>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <style>
    .ttt-board {
      --cell: clamp(84px, 27vw, 116px);
      display: grid;
      grid-template-columns: repeat(3, var(--cell));
      grid-template-rows: repeat(3, var(--cell));
      gap: 7px;
      background: var(--ink);
    }
    .ttt-cell {
      background: var(--ground);
      border: 0;
      padding: 18%;
      cursor: pointer;
      transition: background 120ms ease, opacity 200ms ease;
    }
    .ttt-cell:hover:not(:disabled) {
      background: var(--ground-deep);
    }
    .ttt-cell:disabled {
      cursor: default;
    }
    .ttt-cell svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: none;
      stroke-width: 11;
      stroke-linecap: round;
    }
    .ttt-cell[data-mark="X"] svg { stroke: var(--ink); }
    .ttt-cell[data-mark="O"] svg { stroke: var(--tomato); }
    .ttt-cell svg * {
      stroke-dasharray: 1;
      stroke-dashoffset: 0;
      animation: draw-mark 260ms ease-out both;
    }
    .ttt-cell svg :nth-child(2) {
      animation-delay: 130ms;
    }
    @keyframes draw-mark {
      from { stroke-dashoffset: 1; }
    }
    .ttt-board.has-winner .ttt-cell:not(.is-winning) {
      opacity: 0.3;
    }
  </style>
</head>
<body style="--box: var(--tomato)">

  <nav class="wrap topbar">
    <a class="wordmark-sm" href="../../index.html">Chromo</a>
    <a class="back" href="../../index.html">&larr; Back to the shelf</a>
  </nav>

  <header class="game-band">
    <div class="wrap">
      <h1 class="game-name">Tic-Tac-Toe</h1>
      <span class="spec">2 players · Ages 4+ · 1 min</span>
    </div>
  </header>

  <main class="wrap game-layout">
    <section class="play-area">
      <p class="status" id="status" aria-live="polite">X to move</p>
      <div class="ttt-board" id="board" role="grid" aria-label="Tic-Tac-Toe board"></div>
      <div class="actions">
        <button class="btn" id="reset-round" type="button">New round</button>
        <button class="btn btn-quiet" id="reset-score" type="button">Reset score</button>
      </div>
    </section>

    <aside class="game-side">
      <div class="side-group">
        <h2>Score</h2>
        <dl class="scoreboard">
          <div><dt>X</dt><dd id="score-x">0</dd></div>
          <div><dt>O</dt><dd id="score-o">0</dd></div>
          <div><dt>Draws</dt><dd id="score-d">0</dd></div>
        </dl>
      </div>
      <div class="side-group">
        <h2>How to play</h2>
        <p>Two people share this screen and take turns. X always opens the round. Three marks in a row, across, down or diagonally, wins it.</p>
      </div>
    </aside>
  </main>

  <footer class="wrap site-footer">
    <span>Chromo</span>
    <span>The score resets when you close the page.</span>
  </footer>

  <script src="game.js"></script>
</body>
</html>
